name: CI

on:
  push:
  pull_request:

jobs:
  site:
    name: Static site & privacy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate docs/index.html
        run: python3 tests/check_site.py

      - name: Assert no network egress (privacy promise)
        run: python3 tests/check_no_egress.py

  powershell:
    name: PowerShell parse & lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse-check BatteryWidget.ps1
        shell: pwsh
        run: ./parse_check.ps1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -EnableExit
