name: native

# The WinUI 3 rewrite (native/). Separate from verify.yml, which gates the
# shipping PowerShell app; this one only runs when native/ changes.
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Core logic: the ported PowerShell suite plus live reads of the runner's
      # own (battery-less) power sources
      - name: Test core
        run: dotnet test native/BatteryPill.Tests -c Release -nologo

      # The app must keep compiling (XAML, WinUI, self-contained x64)
      - name: Build app
        run: dotnet build native/BatteryPill -c Release -r win-x64 -p:Platform=x64 -nologo

      # The real app on a real (SAC-free) Windows desktop, driven with real
      # mouse input: frames, focus, click-through, click, fling, menu.
      # Screenshots land in the run's artifacts.
      - name: UI smoke test
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File native/tools/ui-smoke.ps1
          -Exe native/BatteryPill/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/BatteryPill.exe
          -OutDir ui-smoke

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: ui-smoke
